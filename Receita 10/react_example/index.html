<!DOCTYPE html>

<html>

<head>
   <title>ReactZero</title>
</head>

<body>
   <button id="botaoCarregar">Carregar Tabela</button>
   <div id="app"></div>

   <script src="libs/react.js"></script>
   <script src="libs/react-dom.js"></script>
   <script src="libs/babel.js"></script>
   <script type="text/babel">
      const cachacas = [
         { nome: "Havana", marca: "Engenho Anísio Santiago" },
         { nome: "Ypióca", marca: "Ypióca Agroindustrial" },
         { nome: "Seleta", marca: "Seleta e Boazinha" }
      ];
      function Cabecario() {
         return (
            <h1>Minha tabela de bebidas</h1>
         );
      }
      function TabelaBebidas() {
         return (
            <table id="tabela" border="1">
               <thead>
                  <tr>
                     <th>Nome</th>
                     <th>Marca</th>
                  </tr>
               </thead>
               <tbody>
                  {cachacas.map((c, index) => (
                     <tr key={index}>
                        <td>{c.nome}</td>
                        <td>{c.marca}</td>
                     </tr>
                  ))}
               </tbody>
            </table>
         );
      }

      function carregar() {
         ReactDOM.render(
            <div>
               <Cabecario />
               <TabelaBebidas />
            </div>,
            document.getElementById("app")
         );
      }
      document.getElementById("botaoCarregar").addEventListener("click", carregar);
   </script>

</body>

</html>
