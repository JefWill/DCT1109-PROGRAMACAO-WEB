<!DOCTYPE html>

<html>

<head>

<body>

    <div><button id="botaoCarregar">Carregando cervejas...</button></div>

    <div id="cervejasDiv"></div>

</body>



<script>


    let teste = [
        {
            chave1: "valor1",
            chave2: "valor2",
            chave3: "valor3",
            chave4: "valor4"
        },
        {
            chave1: "valor1",

        },
        {
            chave1: "valor1",

            chave3: "valor3",
            chave4: "valor4"
        },
        {
            chave1: "valor1",
            chave2: "valor2",
            chave3: "valor3",
            chave4: "valor4"
        }
    ]
    let cervejas = [

        {

            name: "Guiness",

            alcohol: "10%",

            ibu: "30",

            style: "Red Ale"

        },

        {

            name: "Desperados",

            alcohol: "6%",

            ibu: "40",

            style: "IPA"

        },

        {

            name: "Becks",

            alcohol: "5%",

            ibu: "30",

            style: "Pilsen"

        }

    ]



    //cs é um array de cervejas

    const carregarDiv = (cs, id = "cervejasDiv") => {

        const div = document.getElementById(id)
        const itensHtml = cs.map(cs => {
            const valores = Object.values(cs) //modifiquei a função pra que ficasse 100% generica

            return `<tr>
                                            <td>${valores[0]}</td>
                                            <td>${valores[1]}</td>
                                            <td>${valores[2]}</td>
                                            <td>${valores[3]}</td>
                                            </tr>`})
        const chaves = Object.keys(cs[0])
        div.innerHTML = `<table>
                         <thead>
                            <tr>
                                <th>${chaves[0]}</th>
                                <th>${chaves[1]}</th>
                                <th>${chaves[2]}</th>
                                <th>${chaves[3]}</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itensHtml.join("\n")}
                        </tbody>
                        </table>`

    }



    let botao = document.getElementById("botaoCarregar")

    botao.addEventListener("click", () => carregarDiv(cervejas))



</script>

</html>
