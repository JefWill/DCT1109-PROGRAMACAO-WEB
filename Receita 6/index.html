<!DOCTYPE html>

<html>

<head>

    <meta charset="UTF-8">
    <style>
        table,
        th,
        td {
            font-family: 'comic sans ms';
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
        }

        table {
            border-radius: 5px;
            border-spacing: 10px;

        }

        thead {
            background-color: #333;
            color: #fff;
        }

        th {
            text-align: left;
        }
    </style>
</head>



<body>

    <div><button id="botaoCarregar">Carregando cervejas...</button></div>

    <div id="cervejasDiv"></div>

</body>



<script>



    let cervejas = [

        {

            name: "Guiness",

            alcohol: "10%"

        },

        {

            name: "Desperados",

            alcohol: "6%"

        },

        {

            name: "Becks",

            alcohol: "5%"

        }

    ]



    //cs é um array de cervejas

    const carregarDiv = cs => {

        const div = document.getElementById("cervejasDiv")

        const itensHtml = cs.map(item => `<tr>
                                            <td>${item['name']}</td>
                                            <td>${item['alcohol']}</td>
                                            </tr>`)

        div.innerHTML = `<table>
                         <thead>
                            <tr>
                                <th>Nome</th>
                                <th>Alcohol</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${itensHtml.join("\n")}
                        </tbody>
                        </table>`

    }



    let botao = document.getElementById("botaoCarregar")

    botao.addEventListener("click", () => carregarDiv(cervejas))



</script>

</html>
