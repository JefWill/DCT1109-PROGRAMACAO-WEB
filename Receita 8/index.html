<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        table,
        th,
        td {
            font-family: 'comic sans ms', sans-serif;
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }

        table {
            border-radius: 5px;
            margin-top: 10px;
        }

        thead {
            background-color: #333;
            color: #fff;
        }

        th {
            text-align: left;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
        }

        .mensagem-erro {
            color: #d63031;
            border: 2px dashed #d63031;
            border-radius: 8px;
            font-weight: bold;

        }
    </style>
</head>

<body>
    <div>
        <button id="botaoCarregar">Carregar Cervejarias</button>
        <button id="botaoCarregarUsuarios">Carregar Usuários (JSONPlaceholder)</button>
    </div>
    <div id="cervejasDiv"></div>
    <p>nota: no exercicio 1 da receita 8 passei a usar Promise (.then / .catch) e exibi mais propriedades (Estado e País)!</p>
    <p>nota: no exercicio 2 eu peguei o estilo que ja tinha feito na receita 6!</p>
    <p>nota: no exercicio 4 deixei 50% de chance da url corromper e ai mostrar o erro do catch da promise</p>
</body>

<!-- Importação da função genérica do arquivo externo (Exercício 4) -->
<script src="tabela.js"></script>

<script>

    let cervejas = []
    let usuarios = []

    // Exercício 1 da Receita 8: usar Promise (.then / .catch) e exibir outras propriedades das cervejas
    function carregarCervejas() {
        // 50% de chance de corromper a URL com caractere errado, forçando o erro real de rede do fetch
        const url = Math.random() < 0.5
            ? "https://api.openbrewerydb.org/v1/breweries?per_page=5"
            : "https://api.openbrewerydb.org.ERRADO/v1/breweries?per_page=5"

        fetch(url)
            .then(res => {
                if (!res.ok) throw new Error(`Erro HTTP: ${res.status}`)
                return res.json()
            })
            .then(json => {
                cervejas = json
                // Exibindo outras propriedades além de Nome, Tipo e Cidade (adicionando Estado e País)
                carregarTabelaGenerica(
                    cervejas,
                    "cervejasDiv",
                    ["Nome", "Tipo", "Cidade", "Estado", "País"],
                    ["name", "brewery_type", "city", "state_province", "country"]
                )
            })
            .catch(err => {
                document.getElementById("cervejasDiv").innerHTML = `
                    <div class="mensagem-erro">
                        ferroulhes (demonstrando o catch da promise) XD
                    </div>
                `
            })

        // Mensagem imediata enquanto a Promise está sendo processada em segundo plano
        document.getElementById("cervejasDiv").innerHTML = `Fazendo requisição...`
    }

    async function carregarUsuarios() {
        try {
            // 50% de chance de corromper a URL com caractere errado, forçando o erro real de rede do fetch
            const url = Math.random() < 0.5
                ? "https://jsonplaceholder.typicode.com/users"
                : "https://jsonplaceholder.typicode.com.ERRADO/users"

            let res = await fetch(url)
            usuarios = await res.json()
            // Usa a mesma função genérica passando colunas e propriedades de usuários
            carregarTabelaGenerica(
                usuarios,
                "cervejasDiv",
                ["Nome", "Username", "E-mail", "Telefone"],
                ["name", "username", "email", "phone"]
            )
        } catch (err) {
            document.getElementById("cervejasDiv").innerHTML = `
                <div class="mensagem-erro">
                    ferroulhes (demonstrando o try catch) XD
                </div>
            `
        }
    }

    let botao = document.getElementById("botaoCarregar")
    botao.addEventListener("click", () => carregarCervejas())

    let botaoUsuarios = document.getElementById("botaoCarregarUsuarios")
    botaoUsuarios.addEventListener("click", () => carregarUsuarios())

</script>

</html>
